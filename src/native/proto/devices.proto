syntax = "proto3";

import "google/protobuf/empty.proto";

// The native module drives real devices over HID and reports only hardware facts.
// The main process (src/main/device-state.ts) owns the application device model built
// from them; see src/renderer/proto/devices.proto.

// The bus HIDAPI reports for the keyboard's VIA interface. A wireless receiver is
// plugged in by cable; the main process recognizes it by vendor and product ID.
enum Bus {
  BUS_CABLE = 0;
  BUS_BLUETOOTH = 1;
}

// Lighting values in VIA's form, each from 0 to 255. Effect 0 means lighting off. A
// Chroma device shows hue, saturation, and brightness as one solid color and ignores
// the effect.
message RawLighting {
  int32 effect = 1;
  int32 hue = 2;
  int32 saturation = 3;
  int32 brightness = 4;
}

// A QMK keyboard with VIA.
message ConnectedKeyboard {
  // Opaque and valid only while the device stays open in this native session. A device
  // that is plugged in again, or reopened after a failed write, gets a new one.
  uint32 connection_id = 1;
  uint32 vendor_id = 2;
  uint32 product_id = 3;
  // The USB product string; may be empty.
  string product_name = 4;
  Bus bus = 5;
  int32 protocol_version = 6;
  // The lighting has hue and saturation; single-color lighting has brightness only.
  bool has_color = 7;
  // The lighting has an effect list where 0 is off and 1 is solid color.
  bool has_effect = 8;
  // The keyboard's lighting as read when it was opened, updated after each write.
  RawLighting lighting = 9;
}

// A Logitech HID++ 2.0 mouse paired with a Bolt receiver.
message ConnectedMouse {
  // Shares the numbering of ConnectedKeyboard.connection_id. A mouse that falls asleep
  // and wakes up again gets a new one.
  uint32 connection_id = 1;
  // The name the mouse reports, such as "Signature M650 L".
  string name = 2;
  // The HID++ protocol version, such as "4.5".
  string protocol = 3;
  // Percentage from 0 to 100, read again every few seconds.
  int32 battery = 4;
  bool charging = 5;
  // The sensor DPI as read when the mouse was found, updated after each write.
  int32 dpi = 6;
  int32 min_dpi = 7;
  int32 max_dpi = 8;
}

// What a Razer device is to the Chroma SDK, which lights every keyboard, or every
// mouse, as one.
enum ChromaKind {
  CHROMA_KEYBOARD = 0;
  CHROMA_MOUSE = 1;
}

// A Razer keyboard or mouse lit through the Razer Chroma SDK. Windows only: the SDK
// runtime comes with Razer Synapse, and devices are listed only once it is ready.
message ConnectedChromaDevice {
  // Shares the numbering of ConnectedKeyboard.connection_id.
  uint32 connection_id = 1;
  ChromaKind kind = 2;
  uint32 vendor_id = 3;
  uint32 product_id = 4;
  // The USB product string, such as "Razer Huntsman"; may be empty.
  string product_name = 5;
  // The color last written to this kind of device in this native session, or a
  // default before any write: the SDK cannot read what a device shows.
  RawLighting lighting = 6;
}

message ConnectedDevices {
  repeated ConnectedKeyboard keyboards = 1;
  repeated ConnectedMouse mice = 2;
  repeated ConnectedChromaDevice chroma_devices = 3;
}

message LightingRequest {
  uint32 connection_id = 1;
  RawLighting lighting = 2;
}

message DpiRequest {
  uint32 connection_id = 1;
  int32 dpi = 2;
}

// Native RPC for the real devices that are connected.
service HardwareService {
  // Every device currently open.
  rpc List(google.protobuf.Empty) returns (ConnectedDevices);

  // Writes one complete lighting snapshot to a keyboard or a Chroma device. Fails if
  // the device is gone.
  rpc ApplyLighting(LightingRequest) returns (google.protobuf.Empty);

  // Sets a mouse's sensor DPI. Fails if the mouse is gone or asleep.
  rpc ApplyDpi(DpiRequest) returns (google.protobuf.Empty);
}

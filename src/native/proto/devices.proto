syntax = "proto3";

import "google/protobuf/empty.proto";

// MōBrowser generates native RPC and renderer IPC from separate proto roots.
// Keep this device model aligned with src/renderer/proto/devices.proto. The
// main-process bridge in src/main/devices.ts owns the handoff between them.

// How the device communicates with the computer.
enum LinkType {
  RECEIVER = 0;
  BLUETOOTH = 1;
  WIRED = 2;
}

// Lighting effects supported by the demo keyboard.
enum LightEffect {
  STATIC = 0;
  BREATHING = 1;
  WAVE = 2;
}

message MouseSpec {
  // Stable identifiers shared with Binding.control.
  repeated string buttons = 1;
  int32 min_dpi = 2;
  int32 max_dpi = 3;
}

message KeyboardSpec {
  // Stable identifiers shared with Binding.control.
  repeated string keys = 1;
  bool backlight = 2;
}

message Device {
  string id = 1;
  // Stable product identity shared by every unit of the same model.
  string model_id = 11;
  string model = 2;
  LinkType link = 3;
  string firmware = 4;
  bool connected = 5;
  bool has_battery = 6;
  // Percentage from 0 to 100; ignored when has_battery is false.
  int32 battery = 7;
  bool charging = 10;

  // Hardware capabilities and device category.
  oneof spec {
    MouseSpec mouse = 8;
    KeyboardSpec keyboard = 9;
  }
}

message DeviceId {
  string id = 1;
}

message DeviceList {
  repeated Device devices = 1;
}

// Strings keep vendor-specific controls and actions extensible without
// requiring schema changes.
message Binding {
  string control = 1;
  string action = 2;
}

message MouseSettings {
  repeated Binding bindings = 1;
  int32 dpi = 2;
  // Demo scale from 1 (slowest) to 5 (fastest).
  int32 scroll_speed = 3;
  bool natural_scroll = 4;
}

message KeyboardSettings {
  repeated Binding bindings = 1;
  LightEffect effect = 2;
  // Hue in degrees from 0 to 360.
  int32 hue = 3;
  // Percentage from 0 to 100.
  int32 brightness = 4;
}

message Settings {
  string device_id = 1;

  // Must match the corresponding Device.spec variant.
  oneof kind {
    MouseSettings mouse = 2;
    KeyboardSettings keyboard = 3;
  }
}

// Native RPC implemented by the replaceable device stack.
service DeviceStackService {
  // All devices currently managed by the stack.
  rpc List(google.protobuf.Empty) returns (DeviceList);

  // Nearby devices available to add.
  rpc Discover(google.protobuf.Empty) returns (DeviceList);

  rpc Pair(DeviceId) returns (google.protobuf.Empty);
  rpc Forget(DeviceId) returns (google.protobuf.Empty);
  rpc GetSettings(DeviceId) returns (Settings);

  // Applies one complete snapshot; the main-process bridge owns persistence.
  rpc ApplySettings(Settings) returns (google.protobuf.Empty);
}

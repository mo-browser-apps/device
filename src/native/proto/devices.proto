syntax = "proto3";

import "google/protobuf/empty.proto";

// The native module drives VIA keyboards over HID and reports only hardware facts.
// The main process (src/main/devices.ts) owns the application device model built
// from them; see src/renderer/proto/devices.proto.

// The bus HIDAPI reports for the keyboard's VIA interface. A wireless receiver is
// plugged in by cable; the main process recognizes it by vendor and product ID.
enum Bus {
  BUS_CABLE = 0;
  BUS_BLUETOOTH = 1;
}

// Raw VIA lighting values, each from 0 to 255. Effect 0 means lighting off.
message RawLighting {
  int32 effect = 1;
  int32 hue = 2;
  int32 saturation = 3;
  int32 brightness = 4;
}

message ConnectedKeyboard {
  // Opaque and valid only while the keyboard stays open in this native session. A
  // keyboard that is plugged in again, or reopened after a failed write, gets a new one.
  uint32 connection_id = 1;
  uint32 vendor_id = 2;
  uint32 product_id = 3;
  // The USB product string; may be empty.
  string product_name = 4;
  Bus bus = 5;
  int32 protocol_version = 6;
  // The lighting has hue and saturation; single-color lighting has brightness only.
  bool has_color = 7;
  // The lighting has an effect list where 0 is off and 1 is solid color.
  bool has_effect = 8;
  // The keyboard's lighting as read when it was opened, updated after each write.
  RawLighting lighting = 9;
}

message ConnectedKeyboards {
  repeated ConnectedKeyboard keyboards = 1;
}

message LightingRequest {
  uint32 connection_id = 1;
  RawLighting lighting = 2;
}

// Native RPC for the VIA keyboards that are plugged in.
service ViaService {
  // Every keyboard currently open.
  rpc List(google.protobuf.Empty) returns (ConnectedKeyboards);

  // Writes one complete lighting snapshot. Writes that queue up behind a slow keyboard
  // are merged so only the latest is sent. Fails if the keyboard is gone.
  rpc ApplyLighting(LightingRequest) returns (google.protobuf.Empty);
}

syntax = "proto3";

import "google/protobuf/empty.proto";

// The application device model, owned by the main process (src/main/device-state.ts).
// The native module reports only VIA hardware facts; see src/native/proto/devices.proto.

// How the device communicates with the computer.
enum LinkType {
  RECEIVER = 0;
  BLUETOOTH = 1;
  WIRED = 2;
}

// Lighting effects supported by the demo keyboard.
enum LightEffect {
  STATIC = 0;
  BREATHING = 1;
  WAVE = 2;
}

message MouseSpec {
  // Stable identifiers shared with Binding.control.
  repeated string buttons = 1;
  // Both 0 when the sensor DPI cannot be set.
  int32 min_dpi = 2;
  int32 max_dpi = 3;
  // The mouse has RGB lighting with a settable hue and brightness.
  bool backlight = 4;
}

message KeyboardSpec {
  // Stable identifiers shared with Binding.control.
  repeated string keys = 1;
  bool backlight = 2;
  // The backlight has a settable hue; single-color backlights have brightness only.
  bool color = 3;
  // Lighting effects the backlight can show.
  repeated LightEffect effects = 4;
}

message Device {
  string id = 1;
  // Stable product identity shared by every unit of the same model.
  string model_id = 11;
  string model = 2;
  LinkType link = 3;
  string firmware = 4;
  bool connected = 5;
  bool has_battery = 6;
  // Percentage from 0 to 100; ignored when has_battery is false.
  int32 battery = 7;
  bool charging = 10;
  // True for physical hardware driven by the native module, not the simulation.
  bool live = 12;
  // Changes whenever physical hardware reconnects; zero while disconnected or simulated.
  uint32 connection_id = 13;

  // Hardware capabilities and device category.
  oneof spec {
    MouseSpec mouse = 8;
    KeyboardSpec keyboard = 9;
  }
}

message DeviceId {
  string id = 1;
}

message DeviceList {
  repeated Device devices = 1;
}

// Strings keep vendor-specific controls and actions extensible without
// requiring schema changes.
message Binding {
  string control = 1;
  string action = 2;
}

message MouseSettings {
  reserved 3, 4;
  repeated Binding bindings = 1;
  int32 dpi = 2;
  // Lighting, used when MouseSpec.backlight is set: hue in degrees from 0 to 359 and
  // brightness as a percentage from 0 to 100.
  int32 hue = 5;
  int32 brightness = 6;
}

message KeyboardSettings {
  repeated Binding bindings = 1;
  LightEffect effect = 2;
  // Hue in degrees from 0 to 359.
  int32 hue = 3;
  // Percentage from 0 to 100.
  int32 brightness = 4;
  // The firmware effect, retained when the editor cannot represent it.
  int32 raw_effect = 5;
  // The firmware saturation, retained until the user chooses a hue.
  int32 saturation = 6;
}

message Settings {
  string device_id = 1;

  // Must match the corresponding Device.spec variant.
  oneof kind {
    MouseSettings mouse = 2;
    KeyboardSettings keyboard = 3;
  }
}

service DevicesService {
  // All devices currently managed by the app.
  rpc List(google.protobuf.Empty) returns (DeviceList);

  // Future complete snapshots whenever that set changes.
  rpc Watch(google.protobuf.Empty) returns (stream DeviceList);

  // Nearby devices available to add.
  rpc Discover(google.protobuf.Empty) returns (DeviceList);

  rpc Pair(DeviceId) returns (google.protobuf.Empty);
  rpc Forget(DeviceId) returns (google.protobuf.Empty);
  rpc GetSettings(DeviceId) returns (Settings);

  // Applies and persists one complete device-settings snapshot.
  rpc ApplySettings(Settings) returns (google.protobuf.Empty);
}

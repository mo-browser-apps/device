# Lint and type-check the TypeScript sources.
name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate
        run: npm run gen

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

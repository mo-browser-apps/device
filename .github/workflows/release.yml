# Build production artifacts on macOS (arm64 and Intel) and Windows, then draft a GitHub Release.
#
# Requires a committed package-lock.json (npm ci).
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version/tag, for example v1.2.3
        required: true
        type: string
      release_notes:
        description: Release notes
        required: false
        default: ""
        type: string

permissions:
  id-token: write
  contents: write

jobs:
  build-macos:
    environment: production
    # macos-latest is Apple Silicon. It builds arm64 natively and cross-builds the
    # Intel application.
    runs-on: macos-latest

    strategy:
      # One architecture failing should not cancel the other.
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target-flag: ''
            releases-file: releases.osx.json
          - arch: x64
            target-flag: '--x64'
            releases-file: releases.osx-x64.json

    # On a Mac, `npm run mobrowser -- signcert --gh` exports your Developer ID Application
    # certificate and adds all seven MAC_* secrets below to the production environment.
    env:
      # Base64-encoded Developer ID Application certificate (.p12).
      MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
      # Password used to export the .p12 certificate from Keychain Access.
      MAC_CERTIFICATE_PWD: ${{ secrets.MAC_CERTIFICATE_PWD }}
      # Password for the temporary CI keychain created during the build.
      MAC_KEYCHAIN_PWD: ${{ secrets.MAC_KEYCHAIN_PWD }}
      # Signing identity string, e.g. "Developer ID Application: Your Name (TEAMID)".
      MAC_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
      # Apple Developer Team ID (10-character string found in developer.apple.com).
      MAC_TEAM_ID: ${{ secrets.MAC_TEAM_ID }}
      # Apple ID email used for notarization.
      MAC_APPLE_ID: ${{ secrets.MAC_APPLE_ID }}
      # App-specific password generated at appleid.apple.com for notarization.
      MAC_APPLE_PASSWORD: ${{ secrets.MAC_APPLE_PASSWORD }}
      # Shared private key used to sign auto-update packages on every platform.
      CI_MOBROWSER_AUTOUPDATE_SIGNING_KEY: ${{ secrets.CI_MOBROWSER_AUTOUPDATE_SIGNING_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify macOS signing secrets
        run: |
          set -euo pipefail
          if [ -z "${CI_MOBROWSER_AUTOUPDATE_SIGNING_KEY:-}" ]; then
            echo "CI_MOBROWSER_AUTOUPDATE_SIGNING_KEY is required to sign auto-update packages."
            exit 1
          fi
          if [ -z "${MAC_CERTIFICATE:-}" ]; then
            echo "MAC_CERTIFICATE not set — code signing will be skipped."
            exit 0
          fi
          missing=()
          [ -z "${MAC_CERTIFICATE_PWD:-}" ]    && missing+=(MAC_CERTIFICATE_PWD)
          [ -z "${MAC_KEYCHAIN_PWD:-}" ]        && missing+=(MAC_KEYCHAIN_PWD)
          [ -z "${MAC_CODESIGN_IDENTITY:-}" ]   && missing+=(MAC_CODESIGN_IDENTITY)
          [ -z "${MAC_TEAM_ID:-}" ]             && missing+=(MAC_TEAM_ID)
          [ -z "${MAC_APPLE_ID:-}" ]            && missing+=(MAC_APPLE_ID)
          [ -z "${MAC_APPLE_PASSWORD:-}" ]      && missing+=(MAC_APPLE_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "MAC_CERTIFICATE is set but the following required secrets are missing: ${missing[*]}"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Set up macOS code signing (optional)
        run: |
          set -euo pipefail
          if [ -z "${MAC_CERTIFICATE:-}" ]; then
            echo "Skipping macOS code signing (no MAC_CERTIFICATE secret). Build will produce an unsigned DMG."
            echo "To sign, run 'npm run mobrowser -- signcert --gh' on a Mac to add the signing secrets."
            # Clear all other MAC_* signing vars so the build doesn't attempt to sign
            # with a partially-configured identity that happens to be set in secrets.
            {
              echo "MAC_CERTIFICATE_PWD="
              echo "MAC_KEYCHAIN_PWD="
              echo "MAC_CODESIGN_IDENTITY="
              echo "MAC_TEAM_ID="
              echo "MAC_APPLE_ID="
              echo "MAC_APPLE_PASSWORD="
            } >> "$GITHUB_ENV"
            exit 0
          fi

          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$MAC_KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MAC_KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          curl -fsSL https://www.apple.com/certificateauthority/AppleRootCA-G3.cer -o AppleRootCA-G3.cer
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer -o AppleWWDRCAG6.cer
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o DeveloperIDG2CA.cer

          security import ./AppleRootCA-G3.cer -k "$KEYCHAIN_PATH"
          security import ./AppleWWDRCAG6.cer -k "$KEYCHAIN_PATH"
          security import ./DeveloperIDG2CA.cer -k "$KEYCHAIN_PATH"

          echo "$MAC_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$MAC_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MAC_KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Build release package
        run: npm run build -- --verbose ${{ matrix.target-flag }}

      - name: Build DMG and auto-update packages
        run: npm run pack -- --verbose ${{ matrix.target-flag }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-mac-${{ matrix.arch }}
          path: |
            build/dist/mac-${{ matrix.arch }}/pack/*.dmg
            build/dist/mac-${{ matrix.arch }}/pack/*.nupkg
            build/dist/mac-${{ matrix.arch }}/pack/${{ matrix.releases-file }}
          if-no-files-found: error

  build-windows:
    # The Artifact Signing client authenticates with the service principal's client secret
    # (see AZURE_CLIENT_SECRET below); the `production` environment scopes the secrets.
    environment: production
    runs-on: windows-latest

    env:
      # Azure Artifact Signing account name (Artifact Signing resource in the Azure portal).
      AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
      # Certificate profile name within the Artifact Signing account.
      AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
      # Azure Artifact Signing endpoint URL (e.g. "https://weu.codesigning.azure.net/").
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      # Service principal client ID (app registration) used by DefaultAzureCredential.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      # Azure Active Directory tenant ID of the service principal.
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      # Client secret of the service principal. Together with the client and tenant IDs it
      # lets the Artifact Signing dlib authenticate through EnvironmentCredential from
      # inside `npm run build` and `npm run pack`, with no Azure CLI session.
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      # Azure subscription ID of the service principal.
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Shared private key used to sign auto-update packages on every platform.
      CI_MOBROWSER_AUTOUPDATE_SIGNING_KEY: ${{ secrets.CI_MOBROWSER_AUTOUPDATE_SIGNING_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify Windows signing secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CI_MOBROWSER_AUTOUPDATE_SIGNING_KEY)) {
            Write-Error "CI_MOBROWSER_AUTOUPDATE_SIGNING_KEY is required to sign auto-update packages."
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:AZURE_SIGNING_ACCOUNT_NAME)) {
            Write-Host "AZURE_SIGNING_ACCOUNT_NAME not set — code signing will be skipped."
            exit 0
          }
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:AZURE_CERTIFICATE_PROFILE_NAME)) { $missing += "AZURE_CERTIFICATE_PROFILE_NAME" }
          if ([string]::IsNullOrWhiteSpace($env:AZURE_SIGNING_ENDPOINT))          { $missing += "AZURE_SIGNING_ENDPOINT" }
          if ([string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID))                 { $missing += "AZURE_CLIENT_ID" }
          if ([string]::IsNullOrWhiteSpace($env:AZURE_TENANT_ID))                 { $missing += "AZURE_TENANT_ID" }
          if ([string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_SECRET))             { $missing += "AZURE_CLIENT_SECRET" }
          if ([string]::IsNullOrWhiteSpace($env:AZURE_SUBSCRIPTION_ID))             { $missing += "AZURE_SUBSCRIPTION_ID" }
          if ($missing.Count -gt 0) {
            Write-Error "AZURE_SIGNING_ACCOUNT_NAME is set but the following required secrets are missing: $($missing -join ', ')"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Prepare Windows code signing (optional)
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_SIGNING_ACCOUNT_NAME)) {
            Write-Host "Skipping Windows code signing (no AZURE_SIGNING_ACCOUNT_NAME secret). Build will produce unsigned binaries."
            exit 0
          }
          # Download the Microsoft Artifact Signing Client NuGet package to get Azure.CodeSigning.Dlib.dll.
          # The DLIB is the Azure Artifact Signing integration for signtool.exe.
          # See: https://learn.microsoft.com/en-us/azure/artifact-signing/how-to-signing-integrations
          nuget install Microsoft.ArtifactSigning.Client -OutputDirectory "$env:RUNNER_TEMP\tsigning" -ExcludeVersion -NonInteractive
          $dlib = Get-ChildItem "$env:RUNNER_TEMP\tsigning\Microsoft.ArtifactSigning.Client\bin\x64\Azure.CodeSigning.Dlib.dll" |
            Select-Object -First 1
          if (-not $dlib) {
            throw "Azure.CodeSigning.Dlib.dll not found after installing Microsoft.ArtifactSigning.Client."
          }
          # Write the metadata file that the DLIB reads at signing time.
          $metadataPath = Join-Path $env:RUNNER_TEMP "metadata.json"
          [ordered]@{
            Endpoint                = $env:AZURE_SIGNING_ENDPOINT
            CodeSigningAccountName  = $env:AZURE_SIGNING_ACCOUNT_NAME
            CertificateProfileName  = $env:AZURE_CERTIFICATE_PROFILE_NAME
          } | ConvertTo-Json | Set-Content -Path $metadataPath
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object { $_.FullName } -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw "signtool.exe not found."
          }
          $signCmd = "`"$($signtool.FullName)`" sign /v /fd SHA256 /tr `"http://timestamp.acs.microsoft.com`" /td SHA256 /dlib `"$($dlib.FullName)`" /dmdf `"$metadataPath`" `"@@BINARY_PATH@@`""
          Add-Content -Path $env:GITHUB_ENV -Value "WIN_SIGN_COMMAND<<EOF"
          Add-Content -Path $env:GITHUB_ENV -Value $signCmd
          Add-Content -Path $env:GITHUB_ENV -Value "EOF"

      # MōBrowser verifies each signature with Windows PowerShell. A step that runs under
      # pwsh hands it a PSModulePath without the built-in modules, and
      # Get-AuthenticodeSignature then fails to load, so these steps run under cmd.
      - name: Build release package
        shell: cmd
        run: npm run build -- --verbose

      - name: Build installer and auto-update packages
        id: pack
        shell: cmd
        run: npm run pack -- --verbose

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-win-x64
          path: |
            build/dist/win-x64/pack/*.exe
            build/dist/win-x64/pack/*.nupkg
            build/dist/win-x64/pack/releases.win.json
          if-no-files-found: error

  release:
    name: Create GitHub Release draft
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs:
      - build-macos
      - build-windows

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create GitHub Release draft
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            dist/artifacts-mac-arm64/**/*.dmg
            dist/artifacts-mac-arm64/**/*.nupkg
            dist/artifacts-mac-arm64/**/releases.osx.json
            dist/artifacts-mac-x64/**/*.dmg
            dist/artifacts-mac-x64/**/*.nupkg
            dist/artifacts-mac-x64/**/releases.osx-x64.json
            dist/artifacts-win-x64/**/*.exe
            dist/artifacts-win-x64/**/*.nupkg
            dist/artifacts-win-x64/**/releases.win.json
          tag_name: ${{ inputs.version || github.ref_name }}
          name: ${{ inputs.version || github.ref_name }}
          body: ${{ inputs.release_notes }}
          target_commitish: ${{ github.sha }}
          draft: true

      - name: List release artifacts
        run: ls -R dist

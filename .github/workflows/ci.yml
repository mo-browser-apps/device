name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version/tag, for example v1.2.3
        required: true
        type: string
      release_notes:
        description: Release notes
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS arm64
    runs-on: macos-latest

    env:
      MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
      MAC_CERTIFICATE_PWD: ${{ secrets.MAC_CERTIFICATE_PWD }}
      MAC_KEYCHAIN_PWD: ${{ secrets.MAC_KEYCHAIN_PWD }}
      MAC_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
      MAC_TEAM_ID: ${{ secrets.MAC_TEAM_ID }}
      MAC_APPLE_ID: ${{ secrets.MAC_APPLE_ID }}
      MAC_APPLE_PASSWORD: ${{ secrets.MAC_APPLE_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure runner paths
        shell: bash
        run: |
          echo "MAC_KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain" >> "$GITHUB_ENV"

      - name: Validate signing inputs
        shell: bash
        run: |
          set -euo pipefail

          required=(
            MAC_CERTIFICATE
            MAC_CERTIFICATE_PWD
            MAC_KEYCHAIN_PWD
            MAC_KEYCHAIN_PATH
            MAC_CODESIGN_IDENTITY
            MAC_TEAM_ID
            MAC_APPLE_ID
            MAC_APPLE_PASSWORD
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required secret or environment value is missing: $name"
              exit 1
            fi
          done

      - name: Set up macOS code signing
        shell: bash
        run: |
          set -euo pipefail

          security create-keychain \
            -p "$MAC_KEYCHAIN_PWD" \
            "$MAC_KEYCHAIN_PATH"
          security set-keychain-settings \
            -lut 21600 \
            "$MAC_KEYCHAIN_PATH"
          security unlock-keychain \
            -p "$MAC_KEYCHAIN_PWD" \
            "$MAC_KEYCHAIN_PATH"

          curl -fsSL \
            https://www.apple.com/certificateauthority/AppleRootCA-G3.cer \
            -o "$RUNNER_TEMP/AppleRootCA-G3.cer"
          curl -fsSL \
            https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer \
            -o "$RUNNER_TEMP/AppleWWDRCAG6.cer"
          curl -fsSL \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"

          security import \
            "$RUNNER_TEMP/AppleRootCA-G3.cer" \
            -k "$MAC_KEYCHAIN_PATH"
          security import \
            "$RUNNER_TEMP/AppleWWDRCAG6.cer" \
            -k "$MAC_KEYCHAIN_PATH"
          security import \
            "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            -k "$MAC_KEYCHAIN_PATH"

          echo "$MAC_CERTIFICATE" \
            | base64 --decode \
            > "$RUNNER_TEMP/certificate.p12"

          security import \
            "$RUNNER_TEMP/certificate.p12" \
            -k "$MAC_KEYCHAIN_PATH" \
            -P "$MAC_CERTIFICATE_PWD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$MAC_KEYCHAIN_PWD" \
            "$MAC_KEYCHAIN_PATH"

          security list-keychain \
            -d user \
            -s "$MAC_KEYCHAIN_PATH"

          security find-certificate \
            -c "$MAC_CODESIGN_IDENTITY" \
            "$MAC_KEYCHAIN_PATH" \
            >/dev/null

          security find-identity \
            -v \
            -p codesigning \
            "$MAC_KEYCHAIN_PATH"

      - name: Set application version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="${RELEASE_VERSION#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be X.Y.Z or vX.Y.Z"
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$version"

          plutil -replace app.version.major -string "$major" mobrowser.conf.json
          plutil -replace app.version.minor -string "$minor" mobrowser.conf.json
          plutil -replace app.version.patch -string "$patch" mobrowser.conf.json

          echo "Application version set to $version"

      - name: Build, sign, notarize, and package release
        run: npm run release

      - name: Verify application and installer
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          apps=(build/dist/mac-arm64/bin/*.app)
          dmgs=(build/dist/mac-arm64/pack/*.dmg)

          if (( ${#apps[@]} != 1 )); then
            echo "::error::Expected exactly one app bundle; found ${#apps[@]}"
            find build/dist/mac-arm64 -maxdepth 3 -print || true
            exit 1
          fi

          if (( ${#dmgs[@]} != 1 )); then
            echo "::error::Expected exactly one DMG; found ${#dmgs[@]}"
            find build/dist/mac-arm64 -maxdepth 3 -print || true
            exit 1
          fi

          APP_PATH="${apps[0]}"
          DMG_PATH="${dmgs[0]}"

          codesign --verify --deep --strict --verbose=4 "$APP_PATH"

          codesign_details="$(codesign --display --verbose=4 "$APP_PATH" 2>&1)"
          if ! grep -q '^Authority=Developer ID Application:' <<< "$codesign_details"; then
            echo "::error::App is not signed with a Developer ID Application certificate"
            exit 1
          fi
          if ! grep -q "^TeamIdentifier=${MAC_TEAM_ID}$" <<< "$codesign_details"; then
            echo "::error::App TeamIdentifier does not match MAC_TEAM_ID"
            exit 1
          fi

          hdiutil verify "$DMG_PATH"
          xcrun stapler validate -v "$DMG_PATH"
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=4 \
            "$DMG_PATH"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: build/dist/mac-arm64/pack/*.dmg
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$MAC_KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12"
          rm -f "$RUNNER_TEMP/AppleRootCA-G3.cer"
          rm -f "$RUNNER_TEMP/AppleWWDRCAG6.cer"
          rm -f "$RUNNER_TEMP/DeveloperIDG2CA.cer"

  release:
    name: Create GitHub Release Draft
    runs-on: ubuntu-latest
    needs:
      - build-macos

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: dist/macos-arm64

      - name: Show release artifacts
        shell: bash
        run: find dist -maxdepth 3 -type f -print

      - name: Create GitHub Release draft
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: dist/macos-arm64/*.dmg
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          body: ${{ inputs.release_notes }}
          target_commitish: ${{ github.sha }}
          draft: true

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version/tag, for example v1.2.3
        required: true
        type: string
      release_notes:
        description: Release notes
        required: false
        default: ""
        type: string
      create_draft:
        description: Create the GitHub Release draft after the builds succeed
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS arm64
    runs-on: macos-latest

    env:
      MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
      MAC_CERTIFICATE_PWD: ${{ secrets.MAC_CERTIFICATE_PWD }}
      MAC_KEYCHAIN_PWD: ${{ secrets.MAC_KEYCHAIN_PWD }}
      MAC_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
      MAC_TEAM_ID: ${{ secrets.MAC_TEAM_ID }}
      MAC_APPLE_ID: ${{ secrets.MAC_APPLE_ID }}
      MAC_APPLE_PASSWORD: ${{ secrets.MAC_APPLE_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure runner paths
        shell: bash
        run: |
          echo "MAC_KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain" >> "$GITHUB_ENV"

      - name: Validate signing inputs
        shell: bash
        run: |
          set -euo pipefail

          required=(
            MAC_CERTIFICATE
            MAC_CERTIFICATE_PWD
            MAC_KEYCHAIN_PWD
            MAC_KEYCHAIN_PATH
            MAC_CODESIGN_IDENTITY
            MAC_TEAM_ID
            MAC_APPLE_ID
            MAC_APPLE_PASSWORD
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required secret or environment value is missing: $name"
              exit 1
            fi
          done

      - name: Set up macOS code signing
        shell: bash
        run: |
          set -euo pipefail

          security create-keychain \
            -p "$MAC_KEYCHAIN_PWD" \
            "$MAC_KEYCHAIN_PATH"
          security set-keychain-settings \
            -lut 21600 \
            "$MAC_KEYCHAIN_PATH"
          security unlock-keychain \
            -p "$MAC_KEYCHAIN_PWD" \
            "$MAC_KEYCHAIN_PATH"

          curl -fsSL \
            https://www.apple.com/certificateauthority/AppleRootCA-G3.cer \
            -o "$RUNNER_TEMP/AppleRootCA-G3.cer"
          curl -fsSL \
            https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer \
            -o "$RUNNER_TEMP/AppleWWDRCAG6.cer"
          curl -fsSL \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"

          security import \
            "$RUNNER_TEMP/AppleRootCA-G3.cer" \
            -k "$MAC_KEYCHAIN_PATH"
          security import \
            "$RUNNER_TEMP/AppleWWDRCAG6.cer" \
            -k "$MAC_KEYCHAIN_PATH"
          security import \
            "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            -k "$MAC_KEYCHAIN_PATH"

          echo "$MAC_CERTIFICATE" \
            | base64 --decode \
            > "$RUNNER_TEMP/certificate.p12"

          security import \
            "$RUNNER_TEMP/certificate.p12" \
            -k "$MAC_KEYCHAIN_PATH" \
            -P "$MAC_CERTIFICATE_PWD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$MAC_KEYCHAIN_PWD" \
            "$MAC_KEYCHAIN_PATH"

          security list-keychain \
            -d user \
            -s "$MAC_KEYCHAIN_PATH"

          security find-certificate \
            -c "$MAC_CODESIGN_IDENTITY" \
            "$MAC_KEYCHAIN_PATH" \
            >/dev/null

          security find-identity \
            -v \
            -p codesigning \
            "$MAC_KEYCHAIN_PATH"

      - name: Set application version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="${RELEASE_VERSION#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be X.Y.Z or vX.Y.Z"
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$version"

          plutil -replace app.version.major -string "$major" mobrowser.conf.json
          plutil -replace app.version.minor -string "$minor" mobrowser.conf.json
          plutil -replace app.version.patch -string "$patch" mobrowser.conf.json

          echo "Application version set to $version"

      - name: Build, sign, notarize, and package release
        run: npm run release

      - name: Verify application and installer
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          apps=(build/dist/mac-arm64/bin/*.app)
          dmgs=(build/dist/mac-arm64/pack/*.dmg)

          if (( ${#apps[@]} != 1 )); then
            echo "::error::Expected exactly one app bundle; found ${#apps[@]}"
            find build/dist/mac-arm64 -maxdepth 3 -print || true
            exit 1
          fi

          if (( ${#dmgs[@]} != 1 )); then
            echo "::error::Expected exactly one DMG; found ${#dmgs[@]}"
            find build/dist/mac-arm64 -maxdepth 3 -print || true
            exit 1
          fi

          APP_PATH="${apps[0]}"
          DMG_PATH="${dmgs[0]}"

          codesign --verify --deep --strict --verbose=4 "$APP_PATH"

          codesign_details="$(codesign --display --verbose=4 "$APP_PATH" 2>&1)"
          if ! grep -q '^Authority=Developer ID Application:' <<< "$codesign_details"; then
            echo "::error::App is not signed with a Developer ID Application certificate"
            exit 1
          fi
          if ! grep -q "^TeamIdentifier=${MAC_TEAM_ID}$" <<< "$codesign_details"; then
            echo "::error::App TeamIdentifier does not match MAC_TEAM_ID"
            exit 1
          fi

          hdiutil verify "$DMG_PATH"
          xcrun stapler validate -v "$DMG_PATH"
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=4 \
            "$DMG_PATH"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: build/dist/mac-arm64/pack/*.dmg
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$MAC_KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12"
          rm -f "$RUNNER_TEMP/AppleRootCA-G3.cer"
          rm -f "$RUNNER_TEMP/AppleWWDRCAG6.cer"
          rm -f "$RUNNER_TEMP/DeveloperIDG2CA.cer"

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    environment: production

    permissions:
      contents: read
      # Lets azure/login exchange a GitHub OIDC token for Azure credentials.
      id-token: write

    env:
      AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
      AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate signing inputs
        shell: bash
        run: |
          set -euo pipefail

          required=(
            AZURE_SIGNING_ACCOUNT_NAME
            AZURE_CERTIFICATE_PROFILE_NAME
            AZURE_SIGNING_ENDPOINT
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required secret or environment value is missing: $name"
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Azure login for code signing
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      # The GitHub OIDC assertion behind the login expires after five minutes, while
      # the native build runs longer than that before the first file is signed. An
      # access token for the signing service is fetched now, while the assertion is
      # still valid, and stays in the Azure CLI cache for about an hour.
      - name: Cache an Azure access token for signing
        shell: pwsh
        run: az account get-access-token --scope https://codesigning.azure.net/.default --output none

      # MōBrowser must sign the application itself through `signCommand`: a signed
      # executable refuses to start unless packaging also produced the signed
      # `resources/app.bin.cat` catalog, and that catalog is created only when
      # `signCommand` is set. Signing the binaries after the build does not work.
      - name: Set up Windows code signing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $signDir = Join-Path $env:RUNNER_TEMP 'sign'
          New-Item -ItemType Directory -Force $signDir | Out-Null

          # The Azure Artifact Signing client provides the signtool dlib.
          $clientVersion = '1.0.95'
          $clientZip = Join-Path $signDir 'client.zip'
          Invoke-WebRequest `
            "https://www.nuget.org/api/v2/package/Microsoft.Trusted.Signing.Client/$clientVersion" `
            -OutFile $clientZip
          Expand-Archive $clientZip -DestinationPath (Join-Path $signDir 'client')
          $dlib = Join-Path $signDir 'client\bin\x64\Azure.CodeSigning.Dlib.dll'
          if (-not (Test-Path $dlib)) { throw "Azure.CodeSigning.Dlib.dll not found in the signing client" }

          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName |
            Select-Object -Last 1
          if (-not $signtool) { throw 'signtool.exe not found in the Windows SDK' }

          @{
            Endpoint = $env:AZURE_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:AZURE_SIGNING_ACCOUNT_NAME
            CertificateProfileName = $env:AZURE_CERTIFICATE_PROFILE_NAME
            # The same credential chain azure/artifact-signing-action uses: only the
            # environment, workload identity, and Azure CLI credentials remain, so the
            # client cannot fall back to an interactive sign-in and hang.
            ExcludeCredentials = @(
              'ManagedIdentityCredential'
              'SharedTokenCacheCredential'
              'VisualStudioCredential'
              'VisualStudioCodeCredential'
              'AzurePowerShellCredential'
              'AzureDeveloperCliCredential'
              'InteractiveBrowserCredential'
            )
          } | ConvertTo-Json | Set-Content (Join-Path $signDir 'metadata.json') -Encoding ascii

          # A wrapper keeps paths with spaces out of `signCommand` and gives up after
          # ten minutes instead of blocking the build forever.
          @"
          `$ErrorActionPreference = 'Stop'
          `$arguments = @('sign', '/v', '/debug', '/fd', 'SHA256', '/tr', 'http://timestamp.acs.microsoft.com', '/td', 'SHA256', '/dlib', '$dlib', '/dmdf', '$signDir\metadata.json', `$args[0])
          `$process = Start-Process -FilePath '$($signtool.FullName)' -ArgumentList `$arguments -NoNewWindow -PassThru
          if (-not `$process.WaitForExit(600000)) {
            `$process.Kill()
            Write-Error "signtool did not finish within 10 minutes for `$(`$args[0])"
            exit 1
          }
          exit `$process.ExitCode
          "@ | Set-Content (Join-Path $signDir 'sign.ps1') -Encoding ascii

          "WINDOWS_SIGN_COMMAND=pwsh -NoProfile -File $signDir\sign.ps1 @@BINARY_PATH@@" >> $env:GITHUB_ENV

      - name: Set application version and signing command
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="${RELEASE_VERSION#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be X.Y.Z or vX.Y.Z"
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$version"

          node -e '
            const fs = require("node:fs");
            const [file, major, minor, patch, signCommand] = process.argv.slice(1);
            const conf = JSON.parse(fs.readFileSync(file, "utf8"));
            conf.app.version = { major, minor, patch };
            conf.app.bundle.Windows.signCommand = signCommand;
            fs.writeFileSync(file, JSON.stringify(conf, null, 2) + "\n");
          ' mobrowser.conf.json "$major" "$minor" "$patch" "$WINDOWS_SIGN_COMMAND"

          echo "Application version set to $version"

      # MōBrowser verifies each signature with Windows PowerShell. A step that runs
      # under pwsh hands it a PSModulePath without the built-in modules, and
      # Get-AuthenticodeSignature then fails to load, so these steps run under cmd.
      - name: Build and sign application
        shell: cmd
        run: npm run build -- --verbose

      - name: Build and sign installer and auto-update packages
        shell: cmd
        run: npm run pack -- --verbose

      - name: Verify application and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $app = 'build/dist/win-x64/bin/MoDevice.exe'
          $catalog = 'build/dist/win-x64/bin/resources/app.bin.cat'
          $installers = @(Get-ChildItem build/dist/win-x64/pack -Filter *.exe)
          $nupkgs = @(Get-ChildItem build/dist/win-x64/pack -Filter *.nupkg)
          $manifest = 'build/dist/win-x64/pack/releases.win.json'

          if (-not (Test-Path $app)) { throw 'The application executable is missing' }
          if (-not (Test-Path $catalog)) { throw 'resources/app.bin.cat is missing: the build did not sign the application' }
          if ($installers.Count -ne 1) { throw "Expected exactly one installer; found $($installers.Count)" }
          if ($nupkgs.Count -lt 1) { throw 'Expected at least one .nupkg for auto-update' }
          if (-not (Test-Path $manifest)) { throw 'releases.win.json is missing' }

          # The runtime requires the catalog and the executable to carry the same certificate.
          # A .nupkg is a zip archive and carries no Authenticode signature.
          $thumbprints = @()
          foreach ($file in @($app, $catalog, $installers[0].FullName)) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid') { throw "Signature of $file is $($signature.Status)" }
            $thumbprints += $signature.SignerCertificate.Thumbprint
          }
          if (($thumbprints | Sort-Object -Unique).Count -ne 1) {
            throw "The executable, catalog, and installer are signed with different certificates: $($thumbprints -join ', ')"
          }

          Write-Host "Signed with certificate thumbprint $($thumbprints[0])"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            build/dist/win-x64/pack/*.exe
            build/dist/win-x64/pack/*.nupkg
            build/dist/win-x64/pack/releases.win.json
          if-no-files-found: error

  release:
    name: Create GitHub Release Draft
    runs-on: ubuntu-latest
    if: ${{ inputs.create_draft }}
    needs:
      - build-macos
      - build-windows

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: dist/macos-arm64

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist/windows-x64

      - name: Show release artifacts
        shell: bash
        run: find dist -maxdepth 3 -type f -print

      - name: Create GitHub Release draft
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            dist/macos-arm64/*.dmg
            dist/windows-x64/*.exe
            dist/windows-x64/*.nupkg
            dist/windows-x64/releases.win.json
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          body: ${{ inputs.release_notes }}
          target_commitish: ${{ github.sha }}
          draft: true
